# The Google Maps traffic API on the office NAS (see README.md), set up the
# same way as GET.route: one container with Chrome, reached only through a
# Cloudflare Tunnel, so no port is opened on the NAS or the router.
#
#   traffic.getride.my -> http://traffic-scraper:8000   needs X-Route-Key
#
# Chrome opens when the container starts and stays open (WARM_ON_START,
# BROWSER_IDLE below): GET.ride allows the Google Maps step only 3 s.
#
# By default it uses GET.route's tunnel: the container joins GET.route's
# Docker network (GET_ROUTE_NETWORK in .env), so GET.route's cloudflared can
# reach it by name. Without GET.route, start it with its own tunnel instead
# (see README.md, "Its own tunnel").

# A fixed project name. GET.route's compose file also lives in a folder
# called deploy/nas; without this, both would be the project "nas" and
# commands here could stop GET.route's containers.
name: traffic-scraper

services:
  traffic-scraper:
    build: ../..
    platform: linux/amd64
    image: traffic-scraper:1
    container_name: traffic-scraper
    restart: unless-stopped
    # Chrome needs a large /dev/shm (tmpfs: it only takes memory when used).
    shm_size: 512m
    environment:
      PORT: "8000"
      ROUTE_API_KEY: ${ROUTE_API_KEY:?Set ROUTE_API_KEY in .env (openssl rand -hex 32)}
      CACHE_SECONDS: ${CACHE_SECONDS:-60}
      # A pool of Chrome windows, one lookup each at a time. WARM_WINDOWS are
      # opened at start-up and kept open; more open (up to CHROME_WINDOWS)
      # when every open one is busy, and close after BROWSER_IDLE seconds idle.
      # Each open window uses about 400 MB; see README.md before raising these.
      CHROME_WINDOWS: ${CHROME_WINDOWS:-40}
      WARM_WINDOWS: ${WARM_WINDOWS:-2}
      BROWSER_IDLE: ${BROWSER_IDLE:-300}
      WARM_ON_START: ${WARM_ON_START:-1}
      # A lookup that finds every window busy waits this long, then answers
      # 503, so the Google Maps console still has time to ask the Mac.
      WAIT_FOR_CHROME: ${WAIT_FOR_CHROME:-1}
      # The road shape drops points within this many metres of a straight line.
      POLYLINE_TOLERANCE: ${POLYLINE_TOLERANCE:-5}
    expose:
      - "8000"
    # On the office network too, for the Google Maps console on the Mac mini
    # (its second server, http://192.168.0.13:8301). Every call needs the key.
    ports:
      - "${LAN_PORT:-8301}:8000"
    volumes:
      # Pages Chrome saw when a query failed (see README.md).
      - ./debug:/app/debug
    networks:
      - default
      - get-route
    # 40 windows x ~400 MB would be ~16 GB; this cap protects the NAS (and
    # GET.route) if the pool grows that far: Chrome is stopped, not the NAS.
    mem_limit: ${MEM_LIMIT:-8g}

  # Only with --profile own-tunnel (when GET.route's tunnel isn't used).
  cloudflared:
    profiles: ["own-tunnel"]
    image: cloudflare/cloudflared:2026.9.3
    container_name: traffic-scraper-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}  # set in .env when using --profile own-tunnel
    depends_on:
      - traffic-scraper
    mem_limit: 256m

networks:
  # GET.route's network, where its cloudflared runs. Find its name with:
  #   sudo docker inspect get-route-tunnel --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}'
  get-route:
    external: true
    name: ${GET_ROUTE_NETWORK:?Set GET_ROUTE_NETWORK in .env (GET.route's Docker network)}
